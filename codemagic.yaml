# PATH: nw-parent-app/codemagic.yaml
workflows:
  nw-parent-app:
    name: NW Parental App
    max_build_duration: 60
    environment:
      java: 17
      # No android_signing block needed — uses Codemagic automatic debug certificate

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Write google-services.json
        script: |
          # PARENT_GOOGLE_SERVICES env var must be set in Codemagic → Environment variables
          # Paste the raw contents of google-services.json as the value (not Base64)
          echo "$PARENT_GOOGLE_SERVICES" > "$CM_BUILD_DIR/app/google-services.json"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true