workflows:
  nw-parent-app:
    name: NW Parental App
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - google_credentials

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Write google-services.json
        script: |
          echo "$PARENT_GOOGLE_SERVICES" > "$CM_BUILD_DIR/app/google-services.json"

      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Generate gradlew
        script: |
          cd $CM_BUILD_DIR
          gradle wrapper

      - name: Make gradlew executable
        script: |
          cd $CM_BUILD_DIR
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - rinshan602@gmail.com
        notify:
          success: true
          failure: true